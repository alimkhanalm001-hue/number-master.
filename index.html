
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101522">
<title>NUMBER MASTER</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101522;color:white;font-family:Arial,sans-serif;text-align:center;padding:20px}
h1{color:#f5c542;letter-spacing:3px}
button{border:0;border-radius:12px;padding:13px 18px;margin:6px;background:#f5c542;color:#171717;font-weight:bold;font-size:15px}
#home{padding-top:75px}
#game{display:none;max-width:420px;margin:auto}
.stats{display:flex;justify-content:space-around;margin:20px 0}
.stat{background:#202a3d;padding:12px;border-radius:12px;min-width:90px}
.stat small{display:block;color:#aaa;margin-bottom:5px}
#board{background:#202a3d;padding:9px;border-radius:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;touch-action:none}
.cell{aspect-ratio:1;background:#354158;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,7vw,34px);font-weight:bold;color:#222;animation:appear .16s ease-out}
@keyframes appear{from{transform:scale(.75);opacity:.4}to{transform:scale(1);opacity:1}}
.cell.merged{animation:merge .25s ease}
@keyframes merge{50%{transform:scale(1.16);box-shadow:0 0 18px #f5c542}}
.v2{background:#eee4da}.v4{background:#ede0c8}.v8{background:#f2b179}.v16{background:#f59563;color:white}.v32{background:#f67c5f;color:white}.v64{background:#f65e3b;color:white}.v128{background:#edcf72}.v256{background:#edcc61}.v512{background:#edc850}.v1024{background:#edc53f}.v2048{background:#edc22e}
#message{margin:15px;color:#f5c542;min-height:24px}
#leaderboard{display:none;background:#202a3d;border-radius:14px;padding:15px;margin-top:15px;text-align:left}
#leaderboard h3{text-align:center;color:#f5c542}
.record{display:flex;justify-content:space-between;padding:9px;border-bottom:1px solid #354158}
#overlay{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px;z-index:5}
#popup{background:#202a3d;border:2px solid #f5c542;border-radius:20px;padding:25px;width:100%;max-width:330px;animation:appear .3s}
#popup h2{color:#f5c542}
</style>
</head>
<body>

<div id="home">
<h1>NUMBER MASTER</h1>
<p>Объединяй числа и достигни 2048!</p>
<button onclick="startGame()">ИГРАТЬ</button><br>
<button onclick="toggleSound()" id="homeSound">🔊 ЗВУК: ВКЛ</button>
</div>

<div id="game">
<h1>NUMBER MASTER</h1>
<div class="stats">
<div class="stat"><small>СЧЁТ</small><b id="score">0</b></div>
<div class="stat"><small>РЕКОРД</small><b id="best">0</b></div>
<div class="stat"><small>ХОДЫ</small><b id="moves">0</b></div>
</div>
<div id="board"></div>
<div id="message">Собери число 2048!</div>
<button onclick="undo()">↩ ОТМЕНА</button>
<button onclick="newGame()">НОВАЯ ИГРА</button>
<button onclick="toggleSound()" id="gameSound">🔊</button>
<br>
<button onclick="toggleLeaderboard()">🏆 РЕКОРДЫ</button>
<button onclick="goHome()">В МЕНЮ</button>
<div id="leaderboard">
<h3>🏆 ТОП-5 ИГРОКОВ</h3>
<div id="records"></div>
</div>
</div>

<div id="overlay">
<div id="popup">
<h2 id="popupTitle">🎉 ПОБЕДА!</h2>
<p id="popupText">Ты собрал 2048!</p>
<button onclick="closePopup()">ПРОДОЛЖИТЬ</button>
<button onclick="closePopup();newGame()">НОВАЯ ИГРА</button>
</div>
</div>

<script>
let grid,score=0,moves=0;
let best=Number(localStorage.getItem("nmBest")||0);
let sound=true,previous=null, audio=null;
let addedCell=null,mergedCells=[];
let roundSaved=false,won=false;
let startX=0,startY=0;

function audioReady(){
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  if(!audio)audio=new AC();
  if(audio.state==="suspended")audio.resume();
 }catch(e){}
}
function beep(freq=440){
 if(!sound)return;
 audioReady();
 if(!audio)return;
 try{
  const osc=audio.createOscillator(),gain=audio.createGain();
  osc.type="sine";osc.frequency.value=freq;
  gain.gain.setValueAtTime(.08,audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);
  osc.connect(gain);gain.connect(audio.destination);
  osc.start();osc.stop(audio.currentTime+.12);
 }catch(e){}
}
function toggleSound(){
 audioReady();sound=!sound;
 document.getElementById("homeSound").textContent=sound?"🔊 ЗВУК: ВКЛ":"🔇 ЗВУК: ВЫКЛ";
 document.getElementById("gameSound").textContent=sound?"🔊":"🔇";
 if(sound)beep(650);
}
function startGame(){
 audioReady();beep(520);
 document.getElementById("home").style.display="none";
 document.getElementById("game").style.display="block";
 if(!grid)newGame();
 render();
}
function goHome(){
 beep(350);
 document.getElementById("game").style.display="none";
 document.getElementById("home").style.display="block";
}
function newGame(){
 audioReady();beep(500);
 if(grid&&score>0)saveRecord();
 grid=Array.from({length:4},()=>[0,0,0,0]);
 score=0;moves=0;previous=null;
 roundSaved=false;won=false;
 document.getElementById("message").textContent="Собери число 2048!";
 addTile();addTile();render();
}
function addTile(){
 let empty=[];
 for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!grid[r][c])empty.push([r,c]);
 if(empty.length){
  let [r,c]=empty[Math.floor(Math.random()*empty.length)];
  grid[r][c]=Math.random()<.9?2:4;
  addedCell=r+","+c;
 }
}
function savePrevious(){
 previous={grid:grid.map(row=>row.slice()),score,moves};
}
function undo(){
 audioReady();
 if(!previous){beep(180);return}
 grid=previous.grid.map(row=>row.slice());
 score=previous.score;moves=previous.moves;
 previous=null;beep(300);render();
}
function move(direction){
 if(!grid)return;
 let old=JSON.stringify(grid);
 savePrevious();
 let gained=0;
 mergedCells=[];addedCell=null;
 for(let i=0;i<4;i++){
  let line=[],positions=[];
  for(let j=0;j<4;j++){
   let r=direction==="up"?j:direction==="down"?3-j:i;
   let c=direction==="left"?j:direction==="right"?3-j:i;
   line.push(grid[r][c]);positions.push([r,c]);
  }
  let compact=line.filter(x=>x);
  let result=[];
  for(let j=0;j<compact.length;j++){
   if(compact[j]===compact[j+1]){
    let value=compact[j]*2;
    gained+=value;result.push(value);j++;
   }else result.push(compact[j]);
  }
  while(result.length<4)result.push(0);
  for(let j=0;j<4;j++){
   let r=positions[j][0],c=positions[j][1];
   grid[r][c]=result[j];
   if(result[j]&&result[j]!==line[j])mergedCells.push(r+","+c);
  }
 }
 if(old!==JSON.stringify(grid)){
  score+=gained;moves++;addTile();
  beep(gained?650:420);render();
  if(grid.flat().includes(2048)&&!won){
   won=true;saveRecord();
   showPopup("🎉 ПОБЕДА!","Ты собрал 2048! Отличная работа!");
  }else if(!grid.some(row=>row.includes(0))&&!canMove()){
   document.getElementById("message").textContent="Игра окончена!";
   saveRecord();
   showPopup("ИГРА ОКОНЧЕНА","Твой результат: "+score);
  }
 }else{
  previous=null;mergedCells=[];addedCell=null;
 }
}
function canMove(){
 for(let r=0;r<4;r++)for(let c=0;c<4;c++){
  if(r<3&&grid[r][c]===grid[r+1][c])return true;
  if(c<3&&grid[r][c]===grid[r][c+1])return true;
 }
 return false;
}
function render(){
 let board=document.getElementById("board");
 board.innerHTML="";
 for(let r=0;r<4;r++)for(let c=0;c<4;c++){
  let value=grid[r][c],cell=document.createElement("div");
  cell.className="cell "+(value?"v"+value:"");
  if(mergedCells.includes(r+","+c))cell.classList.add("merged");
  cell.textContent=value||"";
  board.appendChild(cell);
 }
 if(score>best){best=score;localStorage.setItem("nmBest",best)}
 document.getElementById("score").textContent=score;
 document.getElementById("best").textContent=best;
 document.getElementById("moves").textContent=moves;
 document.getElementById("gameSound").textContent=sound?"🔊":"🔇";
}
function saveRecord(){
 if(roundSaved||score<=0)return;
 roundSaved=true;
 let list=JSON.parse(localStorage.getItem("nmRecords")||"[]");
 list.push({score:score,date:new Date().toLocaleDateString("ru-RU")});
 list.sort((a,b)=>b.score-a.score);
 list=list.slice(0,5);
 localStorage.setItem("nmRecords",JSON.stringify(list));
 renderRecords();
}
function renderRecords(){
 let list=JSON.parse(localStorage.getItem("nmRecords")||"[]");
 document.getElementById("records").innerHTML=list.length?
 list.map((x,i)=>'<div class="record"><span>'+(i+1)+'. '+x.date+'</span><b>'+x.score+'</b></div>').join(""):
 '<p style="text-align:center">Пока нет рекордов</p>';
}
function toggleLeaderboard(){
 let box=document.getElementById("leaderboard");
 box.style.display=box.style.display==="block"?"none":"block";
 renderRecords();beep(450);
}
function showPopup(title,message){
 document.getElementById("popupTitle").textContent=title;
 document.getElementById("popupText").textContent=message;
 document.getElementById("overlay").style.display="flex";
 beep(780);
}
function closePopup(){
 document.getElementById("overlay").style.display="none";
}
const board=document.getElementById("board");
board.addEventListener("touchstart",e=>{
 startX=e.changedTouches[0].screenX;
 startY=e.changedTouches[0].screenY;
},{passive:true});
board.addEventListener("touchend",e=>{
 let dx=e.changedTouches[0].screenX-startX;
 let dy=e.changedTouches[0].screenY-startY;
 if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;
 if(Math.abs(dx)>Math.abs(dy))move(dx>0?"right":"left");
 else move(dy>0?"down":"up");
},{passive:true});
document.addEventListener("keydown",e=>{
 const keys={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};
 if(keys[e.key]){e.preventDefault();move(keys[e.key])}
});
document.getElementById("best").textContent=best;
renderRecords();
</script>
</body>
</html>
