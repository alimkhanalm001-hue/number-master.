
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>NUMBER MASTER</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;display:flex;justify-content:center;padding:25px 15px}
.app{width:100%;max-width:420px}
header{text-align:center;font-size:27px;font-weight:900;letter-spacing:2px;margin:20px 0 25px}
.stats{display:flex;gap:8px;margin-bottom:15px}
.stat{flex:1;background:#202d42;padding:12px;border-radius:12px;text-align:center}
.stat small{display:block;color:#9eacc1;font-size:11px}
.stat strong{font-size:22px}
#board{background:#202d42;padding:9px;border-radius:15px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;touch-action:none;aspect-ratio:1}
.cell{background:#34435a;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,7vw,34px);font-weight:bold}
.v2{background:#dce6f5;color:#172033}.v4{background:#bdcfea;color:#172033}
.v8{background:#899af2}.v16{background:#7778e8}.v32{background:#a36be0}
.v64{background:#c568d2}.v128{background:#e5a34c;color:#222}
.v256{background:#ec8844;color:#222}.v512{background:#ed6948}
.v1024,.v2048{background:#f0c44d;color:#222;font-size:23px}
.buttons{display:flex;gap:10px;margin-top:15px}
button{flex:1;border:0;border-radius:12px;padding:15px;background:#34435a;color:white;font-weight:bold;font-size:15px}
.primary{background:#8058e8}
p{text-align:center;color:#9eacc1;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div class="app">
<header>NUMBER MASTER</header>
<div class="stats">
<div class="stat"><small>СЧЁТ</small><strong id="score">0</strong></div>
<div class="stat"><small>РЕКОРД</small><strong id="best">0</strong></div>
<div class="stat"><small>ХОДЫ</small><strong id="moves">0</strong></div>
</div>
<div id="board"></div>
<div class="buttons">
<button onclick="undo()">↶ Отменить</button>
<button class="primary" onclick="start()">Новая игра</button>
</div>
<p>Соединяй одинаковые числа, чтобы получить 2048.<br>Свайпай по полю в любом направлении.</p>
</div>
<script>
let grid,score=0,moves=0,best=Number(localStorage.best||0),previous=null;
const board=document.getElementById('board');

function add(){
 let empty=[];
 grid.forEach((r,y)=>r.forEach((v,x)=>{if(!v)empty.push([y,x])}));
 if(!empty.length)return;
 let [y,x]=empty[Math.floor(Math.random()*empty.length)];
 grid[y][x]=Math.random()<.9?2:4;
}
function start(){
 grid=Array.from({length:4},()=>[0,0,0,0]);
 score=0;moves=0;previous=null;
 add();add();render();save();
}
function save(){
 localStorage.best=best;
 localStorage.game=JSON.stringify({grid,score,moves});
}
function render(){
 board.innerHTML='';
 grid.flat().forEach(v=>{
  let d=document.createElement('div');
  d.className='cell'+(v?' v'+v:'');
  d.textContent=v||'';
  board.appendChild(d);
 });
 document.getElementById('score').textContent=score;
 document.getElementById('best').textContent=best;
 document.getElementById('moves').textContent=moves;
}
function move(direction){
 let old=JSON.stringify({grid,score,moves});
 let next=Array.from({length:4},()=>[0,0,0,0]),gain=0;
 for(let i=0;i<4;i++){
  let line=[];
  for(let j=0;j<4;j++){
   let y=direction==='up'?j:direction==='down'?3-j:i;
   let x=direction==='left'?j:direction==='right'?3-j:i;
   line.push(grid[y][x]);
  }
  line=line.filter(Boolean);
  for(let j=0;j<line.length-1;j++){
   if(line[j]===line[j+1]){
    line[j]*=2;gain+=line[j];line.splice(j+1,1);
   }
  }
  while(line.length<4)line.push(0);
  for(let j=0;j<4;j++){
   let y=direction==='up'?j:direction==='down'?3-j:i;
   let x=direction==='left'?j:direction==='right'?3-j:i;
   next[y][x]=line[j];
  }
 }
 if(JSON.stringify(next)===JSON.stringify(grid))return;
 previous=old;grid=next;score+=gain;moves++;add();
 if(score>best)best=score;
 render();save();
 if(grid.flat().includes(2048))setTimeout(()=>alert('Поздравляем! Ты собрал 2048!'),100);
 if(!grid.flat().includes(0)&&!canMove())setTimeout(()=>alert('Игра окончена! Начни новую игру.'),100);
}
function canMove(){
 for(let y=0;y<4;y++)for(let x=0;x<4;x++){
  if(x<3&&grid[y][x]===grid[y][x+1])return true;
  if(y<3&&grid[y][x]===grid[y+1][x])return true;
 }
 return false;
}
function undo(){
 if(!previous)return;
 let s=JSON.parse(previous);
 grid=s.grid;score=s.score;moves=s.moves;previous=null;
 render();save();
}
let sx=0,sy=0;
board.addEventListener('touchstart',e=>{
 sx=e.touches[0].clientX;sy=e.touches[0].clientY;
},{passive:true});
board.addEventListener('touchend',e=>{
 let dx=e.changedTouches[0].clientX-sx;
 let dy=e.changedTouches[0].clientY-sy;
 if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;
 move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
},{passive:true});
document.addEventListener('keydown',e=>{
 let keys={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
 if(keys[e.key]){e.preventDefault();move(keys[e.key]);}
});
try{
 let saved=JSON.parse(localStorage.game);
 if(saved&&saved.grid){grid=saved.grid;score=saved.score||0;moves=saved.moves||0;render();}
 else start();
}catch(e){start();}
</script>
</body>
</html>
