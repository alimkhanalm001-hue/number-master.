
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827">
<title>NUMBER MASTER</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.app{width:100%;max-width:420px}
.screen{text-align:center}
.logo{font-size:31px;font-weight:900;letter-spacing:3px;margin:35px 0 8px}
.tag{color:#94a3b8;font-size:12px;letter-spacing:3px;margin-bottom:50px}
.hero{font-size:75px;font-weight:900;color:#a78bfa;margin:25px}
button{border:0;border-radius:14px;padding:16px;color:white;background:#34435a;font-size:16px;font-weight:bold}
.primary{background:#8058e8;width:100%;margin:10px 0}
.secondary{background:#26344a;width:100%;margin:5px 0}
.hidden{display:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.title{font-weight:900;letter-spacing:2px;font-size:19px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}
.stat{background:#202d42;border-radius:13px;padding:12px;text-align:center}
.stat small{display:block;color:#94a3b8;font-size:10px}
.stat strong{font-size:22px}
#board{background:#202d42;padding:9px;border-radius:17px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;aspect-ratio:1;touch-action:none}
.cell{background:#34435a;border-radius:10px;display:flex;justify-content:center;align-items:center;font-size:clamp(22px,7vw,34px);font-weight:900}
.v2{background:#dce6f5;color:#172033}.v4{background:#bdcfea;color:#172033}
.v8{background:#899af2}.v16{background:#7778e8}.v32{background:#a36be0}
.v64{background:#c568d2}.v128{background:#e5a34c;color:#222}
.v256{background:#ec8844;color:#222}.v512{background:#ed6948}
.v1024,.v2048,.v4096{background:#f0c44d;color:#222;font-size:23px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.buttons button{font-size:14px}
.info{text-align:center;color:#94a3b8;font-size:12px;line-height:1.5;margin-top:16px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:25px}
.box{background:#202d42;border:1px solid #40506a;border-radius:22px;padding:28px;width:100%;max-width:330px;text-align:center}
.box h2{margin-top:0}
</style>
</head>
<body>
<main class="app">
<section id="home" class="screen">
<div class="logo">NUMBER MASTER</div>
<div class="tag">MERGE · THINK · WIN</div>
<div class="hero">2048</div>
<button class="primary" onclick="play()">ИГРАТЬ</button>
<button class="secondary" onclick="toggleSound()">ЗВУК: <span id="soundHome">ВКЛ</span></button>
<p class="info">Объединяй числа. Достигни 2048!</p>
</section>
<section id="game" class="hidden">
<div class="top">
<button onclick="menu()" style="padding:10px 13px">←</button>
<div class="title">NUMBER MASTER</div>
<button onclick="toggleSound()" style="padding:10px 13px">♫</button>
</div>
<div class="stats">
<div class="stat"><small>СЧЁТ</small><strong id="score">0</strong></div>
<div class="stat"><small>РЕКОРД</small><strong id="best">0</strong></div>
<div class="stat"><small>ХОДЫ</small><strong id="moves">0</strong></div>
</div>
<div id="board"></div>
<div class="buttons">
<button onclick="undo()">↶ Отменить</button>
<button onclick="restart()">Новая игра</button>
</div>
<p class="info">Свайпай вверх, вниз, влево или вправо.</p>
</section>
</main>
<div class="modal" id="modal"><div class="box">
<h2 id="modalTitle"></h2><p id="modalText"></p>
<button class="primary" onclick="closeModal()">Продолжить</button>
<button class="secondary" onclick="newGame()">Новая игра</button>
</div></div>
<script>
let grid,score=0,moves=0,best=Number(localStorage.best||0),previous=null,sound=true,won=false;
const board=document.getElementById('board');
function beep(freq=450){if(!sound)return;try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.12);o.stop(c.currentTime+.13)}catch(e){}}
function toggleSound(){sound=!sound;document.getElementById('soundHome').textContent=sound?'ВКЛ':'ВЫКЛ';beep(600)}
function add(){let a=[];grid.forEach((r,y)=>r.forEach((v,x)=>{if(!v)a.push([y,x])}));if(!a.length)return;let [y,x]=a[Math.floor(Math.random()*a.length)];grid[y][x]=Math.random()<.9?2:4}
function save(){localStorage.best=best;localStorage.game=JSON.stringify({grid,score,moves,won})}
function render(){board.innerHTML='';grid.flat().forEach(v=>{let d=document.createElement('div');d.className='cell'+(v?' v'+v:'');d.textContent=v||'';board.appendChild(d)});document.getElementById('score').textContent=score;document.getElementById('best').textContent=best;document.getElementById('moves').textContent=moves}
function newGame(){grid=Array.from({length:4},()=>[0,0,0,0]);score=0;moves=0;previous=null;won=false;add();add();render();save();document.getElementById('modal').style.display='none'}
function play(){document.getElementById('home').classList.add('hidden');document.getElementById('game').classList.remove('hidden');if(!grid)newGame();else render()}
function menu(){document.getElementById('game').classList.add('hidden');document.getElementById('home').classList.remove('hidden')}
function restart(){document.getElementById('modalTitle').textContent='Новая игра?';document.getElementById('modalText').textContent='Текущий прогресс будет заменён.';document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
function line(a){a=a.filter(Boolean);let gain=0;for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;gain+=a[i];a.splice(i+1,1)}while(a.length<4)a.push(0);return [a,gain]}
function move(dir){let old=JSON.stringify({grid,score,moves,won}),next=Array.from({length:4},()=>[0,0,0,0]),gain=0;for(let i=0;i<4;i++){let a=[];for(let j=0;j<4;j++){let y=dir==='up'?j:dir==='down'?3-j:i,x=dir==='left'?j:dir==='right'?3-j:i;a.push(grid[y][x])}let [b,g]=line(a);gain+=g;for(let j=0;j<4;j++){let y=dir==='up'?j:dir==='down'?3-j:i,x=dir==='left'?j:dir==='right'?3-j:i;next[y][x]=b[j]}}if(JSON.stringify(next)===JSON.stringify(grid))return;previous=old;grid=next;score+=gain;moves++;add();if(score>best)best=score;render();save();beep(gain?700:350);if(!won&&grid.flat().includes(2048)){won=true;show('ПОБЕДА!','Ты собрал 2048!');save()}else if(!grid.flat().includes(0)&&!canMove())show('ИГРА ОКОНЧЕНА','Попробуй ещё раз!')}
function canMove(){for(let y=0;y<4;y++)for(let x=0;x<4;x++)if((x<3&&grid[y][x]===grid[y][x+1])||(y<3&&grid[y][x]===grid[y+1][x]))return true;return false}
function show(t,m){document.getElementById('modalTitle').textContent=t;document.getElementById('modalText').textContent=m;document.getElementById('modal').style.display='flex'}
function undo(){if(!previous)return;let s=JSON.parse(previous);grid=s.grid;score=s.score;moves=s.moves;won=s.won;previous=null;render();save()}
function startLoad(){try{let s=JSON.parse(localStorage.game);if(s&&s.grid){grid=s.grid;score=s.score||0;moves=s.moves||0;won=!!s.won}}catch(e){}}
let sx=0,sy=0;board.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});board.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:true});
document.addEventListener('keydown',e=>{let k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(k)move(k)});
document.querySelector('.box .primary').onclick=closeModal;
document.querySelector('.box .secondary').onclick=newGame;
startLoad();
</script>
</body>
</html>
