
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#101827">
<title>NUMBER MASTER 4.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;text-align:center;padding:20px 14px}
h1{font-size:30px;margin:12px 0 5px;letter-spacing:2px}
.sub{color:#9eabc0;margin-bottom:22px}
button{border:0;border-radius:13px;padding:14px 18px;font-size:16px;font-weight:bold;cursor:pointer}
.primary{background:#f5a623;color:#172033}
.secondary{background:#26354c;color:white}
#menu,#game{max-width:430px;margin:auto}
#game{display:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.stat{background:#202d42;padding:12px 5px;border-radius:12px}
.stat small{display:block;color:#aab8ce;font-size:11px;margin-bottom:6px}
.stat strong{font-size:20px}
.level{color:#f5b942;font-weight:bold;margin:12px}
.board{background:#1b293d;padding:9px;border-radius:15px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;touch-action:none}
.cell{aspect-ratio:1;background:#34445a;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,7vw,30px);font-weight:bold;color:#172033;animation:appear .13s}
@keyframes appear{from{transform:scale(.85);opacity:.5}to{transform:scale(1);opacity:1}}
.v2{background:#eee4da}.v4{background:#ede0c8}.v8{background:#f2b179}.v16{background:#f59563}.v32{background:#f67c5f}.v64{background:#f65e3b}.v128{background:#edcf72}.v256{background:#edcc61}.v512{background:#edc850}.v1024{background:#edc53f}.v2048{background:#edc22e}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.controls button{font-size:14px}
.message{min-height:28px;color:#f5b942;margin:12px 0}
.panel{background:#202d42;border-radius:14px;padding:15px;margin:14px 0;text-align:left}
.panel h3{text-align:center;margin:3px 0 12px}
.panel p{color:#bdc9da;margin:8px 0}
#records{display:none}
.overlay{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px;z-index:5}
.dialog{background:#202d42;padding:26px;border-radius:20px;width:100%;max-width:340px}
.dialog h2{color:#f5b942}
</style>
</head>
<body>
<div id="menu">
<h1>NUMBER MASTER</h1>
<div class="sub">4.0 — Become a Number Master</div>
<button class="primary" onclick="startGame()">ИГРАТЬ</button>
<div class="panel">
<h3>🏆 ТВОЯ СТАТИСТИКА</h3>
<p>Всего игр: <b id="mGames">0</b></p>
<p>Победы: <b id="mWins">0</b></p>
<p>Поражения: <b id="mLosses">0</b></p>
<p>Лучший результат: <b id="mBest">0</b></p>
</div>
<button class="secondary" onclick="showRecords()">🏆 РЕКОРДЫ</button>
</div>

<div id="game">
<h1>NUMBER MASTER</h1>
<div class="level" id="level">УРОВЕНЬ 1 · ЦЕЛЬ 2048</div>
<div class="stats">
<div class="stat"><small>СЧЁТ</small><strong id="score">0</strong></div>
<div class="stat"><small>РЕКОРД</small><strong id="best">0</strong></div>
<div class="stat"><small>ХОДЫ</small><strong id="moves">0</strong></div>
</div>
<div class="board" id="board"></div>
<div class="message" id="message">Объединяй одинаковые числа!</div>
<div class="controls">
<button class="secondary" onclick="undo()">↩ ОТМЕНА</button>
<button class="primary" onclick="newGame()">НОВАЯ ИГРА</button>
<button class="secondary" onclick="shareResult()">📤 ПОДЕЛИТЬСЯ</button>
<button class="secondary" onclick="showRecords()">🏆 РЕКОРДЫ</button>
<button class="secondary" onclick="showStats()">📊 СТАТИСТИКА</button>
<button class="secondary" onclick="goMenu()">В МЕНЮ</button>
</div>
<div id="records" class="panel">
<h3>🏆 ТОП-5 РЕЗУЛЬТАТОВ</h3>
<div id="recordList"></div>
</div>
<div id="statistics" class="panel" style="display:none">
<h3>📊 СТАТИСТИКА</h3>
<div id="statsDetails"></div>
</div>
</div>

<div class="overlay" id="overlay">
<div class="dialog">
<h2 id="dialogTitle">ПОБЕДА!</h2>
<p id="dialogText"></p>
<button class="primary" onclick="closeDialog()">ПРОДОЛЖИТЬ</button>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let grid=[],score=0,moves=0,best=Number(localStorage.getItem('nmBest')||0);
let history=null,gameOver=false,won=false,roundSaved=false;
let stats=JSON.parse(localStorage.getItem('nmStats')||'{"games":0,"wins":0,"losses":0}');
let records=JSON.parse(localStorage.getItem('nmRecords')||'[]');
let level=1;
let touchX=0,touchY=0;

function target(){return 2048*Math.pow(2,level-1)}
function saveStats(){localStorage.setItem('nmStats',JSON.stringify(stats))}
function updateMenu(){
$('mGames').textContent=stats.games;
$('mWins').textContent=stats.wins;
$('mLosses').textContent=stats.losses;
$('mBest').textContent=best;
}
function startGame(){
$('menu').style.display='none';
$('game').style.display='block';
newGame();
}
function goMenu(){
$('game').style.display='none';
$('menu').style.display='block';
updateMenu();
}
function newGame(){
if(grid.length && !roundSaved && score>0)saveRecord();
grid=Array.from({length:4},()=>Array(4).fill(0));
score=0;moves=0;level=1;gameOver=false;won=false;roundSaved=false;history=null;
addTile();addTile();render();
$('records').style.display='none';
$('statistics').style.display='none';
$('message').textContent='Объединяй одинаковые числа!';
}
function addTile(){
let empty=[];
for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!grid[r][c])empty.push([r,c]);
if(empty.length){
let [r,c]=empty[Math.floor(Math.random()*empty.length)];
grid[r][c]=Math.random()<.9?2:4;
}
}
function render(){
$('board').innerHTML='';
grid.flat().forEach(v=>{
let cell=document.createElement('div');
cell.className='cell '+(v?'v'+v:'');
cell.textContent=v||'';
if(v>=1024)cell.style.fontSize='clamp(16px,5vw,24px)';
$('board').appendChild(cell);
});
$('score').textContent=score;
$('best').textContent=best;
$('moves').textContent=moves;
$('level').textContent='УРОВЕНЬ '+level+' · ЦЕЛЬ '+target();
}
function snapshot(){
history={grid:grid.map(row=>row.slice()),score,moves,level};
}
function move(direction){
if(gameOver)return;
let old=grid.map(row=>row.slice());
snapshot();
let changed=false;
for(let i=0;i<4;i++){
let line=[];
for(let j=0;j<4;j++){
let r=direction==='up'?j:direction==='down'?3-j:i;
let c=direction==='left'?j:direction==='right'?3-j:i;
line.push(grid[r][c]);
}
let compact=line.filter(Boolean);
for(let j=0;j<compact.length-1;j++){
if(compact[j]===compact[j+1]){
compact[j]*=2;score+=compact[j];compact.splice(j+1,1);
}
}
while(compact.length<4)compact.push(0);
for(let j=0;j<4;j++){
let r=direction==='up'?j:direction==='down'?3-j:i;
let c=direction==='left'?j:direction==='right'?3-j:i;
grid[r][c]=compact[j];
}
}
changed=JSON.stringify(old)!==JSON.stringify(grid);
if(!changed){history=null;return}
moves++;
addTile();
if(score>best){best=score;localStorage.setItem('nmBest',best)}
checkMilestone();
render();
if(!canMove())endGame(false);
}
function checkMilestone(){
let max=Math.max(...grid.flat());
if(max>=target()&&!won){
won=true;
stats.wins++;
saveStats();
showDialog('🎉 УРОВЕНЬ ПРОЙДЕН!','Ты достиг числа '+target()+'! Можешь продолжать игру и идти дальше.');
level++;
won=false;
}
}
function canMove(){
for(let r=0;r<4;r++)for(let c=0;c<4;c++){
if(!grid[r][c])return true;
if(r<3&&grid[r][c]===grid[r+1][c])return true;
if(c<3&&grid[r][c]===grid[r][c+1])return true;
}
return false;
}
function endGame(){
gameOver=true;
if(!roundSaved){stats.losses++;saveStats();saveRecord()}
showDialog('ИГРА ОКОНЧЕНА','Твой результат: '+score+' очков. Попробуй ещё раз!');
}
function saveRecord(){
if(roundSaved)return;
roundSaved=true;
stats.games++;
saveStats();
records.push({score,date:new Date().toLocaleDateString('ru-RU')});
records.sort((a,b)=>b.score-a.score);
records=records.slice(0,5);
localStorage.setItem('nmRecords',JSON.stringify(records));
}
function undo(){
if(!history)return;
grid=history.grid;score=history.score;moves=history.moves;level=history.level;
gameOver=false;history=null;render();
}
function showDialog(title,message){
$('dialogTitle').textContent=title;
$('dialogText').textContent=message;
$('overlay').style.display='flex';
}
function closeDialog(){
$('overlay').style.display='none';
render();
}
function showRecords(){
let html=records.length?records.map((r,i)=>'<p>'+(i+1)+'. '+r.score+' очков — '+r.date+'</p>').join(''):'<p>Пока нет результатов. Сыграй партию!</p>';
$('recordList').innerHTML=html;
$('records').style.display='block';
$('statistics').style.display='none';
}
function showStats(){
$('statsDetails').innerHTML='<p>Всего игр: '+stats.games+'</p><p>Победы: '+stats.wins+'</p><p>Поражения: '+stats.losses+'</p><p>Лучший результат: '+best+'</p>';
$('statistics').style.display='block';
$('records').style.display='none';
}
function shareResult(){
let message='Я играю в NUMBER MASTER! Мой результат: '+score+' очков. Попробуй побить его!';
if(navigator.share)navigator.share({title:'NUMBER MASTER',text:message,url:location.href}).catch(()=>{});
else if(navigator.clipboard)navigator.clipboard.writeText(message+' '+location.href).then(()=>alert('Результат скопирован!'));
else alert(message);
}
$('board').addEventListener('touchstart',e=>{
touchX=e.changedTouches[0].screenX;touchY=e.changedTouches[0].screenY;
},{passive:true});
$('board').addEventListener('touchend',e=>{
let dx=e.changedTouches[0].screenX-touchX;
let dy=e.changedTouches[0].screenY-touchY;
if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;
move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
},{passive:true});
document.addEventListener('keydown',e=>{
let keys={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
if(keys[e.key]){e.preventDefault();move(keys[e.key])}
});
updateMenu();
</script>
</body>
</html>
